name: Refresh dependency lock

on:
  push:
    branches:
      - fix/issue-11-quality-release

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-11-quality-release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh fixable dependency advisories in the lockfile
        run: npm audit fix --package-lock-only
      - name: Commit refreshed lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already contains the available advisory fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile security fixes"
          git push origin HEAD:fix/issue-11-quality-release
