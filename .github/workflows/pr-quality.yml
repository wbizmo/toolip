name: PR Quality and Security

on:
  # Accept completed PR-head Stage A runs; validate protected main and exact
  # immutable PR identities with the trusted approval artifact below.
  workflow_run:
    workflows: [Stage A Trusted Pre-execution Gate]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  stage-a-result:
    name: Verify trusted Stage A result
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.verify.outputs.repository }}
      pull_request: ${{ steps.verify.outputs.pull_request }}
      base_sha: ${{ steps.verify.outputs.base_sha }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      merge_sha: ${{ steps.verify.outputs.merge_sha }}
      complexity_evidence: ${{ steps.verify.outputs.complexity_evidence }}
    steps:
      - name: Fail closed when Stage A did not succeed
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo 'Stage A did not succeed; downstream checks are blocked.'
          exit 1
      - name: Checkout trusted default-branch verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Download metadata from the completed Stage A run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-a-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/stage-a
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Snapshot current PR identity outside the shell
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STAGE_A_APPROVAL_PATH: ${{ runner.temp }}/stage-a/stage-a-approval.json
          STAGE_A_CURRENT_PR_PATH: ${{ runner.temp }}/stage-a/current-pr.json
        with:
          script: |
            const fs = require('node:fs');
            const approvalText = fs.readFileSync(process.env.STAGE_A_APPROVAL_PATH, 'utf8');
            if (Buffer.byteLength(approvalText, 'utf8') > 256 * 1024) {
              core.setFailed('Stage A approval artifact exceeds its size budget.');
              return;
            }
            const approval = JSON.parse(approvalText);
            if (!Number.isSafeInteger(approval.pullRequest)) {
              core.setFailed('Stage A approval has an invalid pull request number.');
              return;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: approval.pullRequest
            });
            const identity = {
              number: pullRequest.number,
              state: pullRequest.state,
              body: pullRequest.body,
              base: {
                repo: { full_name: pullRequest.base.repo.full_name },
                ref: pullRequest.base.ref,
                sha: pullRequest.base.sha
              },
              head: { sha: pullRequest.head.sha },
              merge_commit_sha: pullRequest.merge_commit_sha
            };
            fs.writeFileSync(process.env.STAGE_A_CURRENT_PR_PATH, JSON.stringify(identity), { mode: 0o600 });
      - name: Validate approval identity and immutable commits
        id: verify
        env:
          TOOLIP_STAGE_A_NPM_PROVENANCE_POLICY: ${{ vars.TOOLIP_STAGE_A_NPM_PROVENANCE_POLICY }}
          TOOLIP_STAGE_A_CARGO_SHA256_POLICY: ${{ vars.TOOLIP_STAGE_A_CARGO_SHA256_POLICY }}
        run: node scripts/verify-stage-a-artifact.mjs "${{ runner.temp }}/stage-a/stage-a-approval.json" "${{ runner.temp }}/stage-a/current-pr.json"

  complexity-evidence:
    name: Require algorithmic complexity evidence
    runs-on: ubuntu-latest
    needs: stage-a-result
    if: needs.stage-a-result.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Verify PR time/space analysis is documented
        if: needs.stage-a-result.outputs.complexity_evidence != 'true'
        run: |
          echo 'Missing required PR complexity disclosure from the trusted Stage A event record.'
          exit 1
      - name: Record reviewer requirement
        if: needs.stage-a-result.outputs.complexity_evidence == 'true'
        run: echo 'Complexity disclosure present; reviewer must validate correctness.'

  static:
    name: Typecheck, lint, formatting, workflow and lockfile policy
    runs-on: ubuntu-latest
    needs: stage-a-result
    timeout-minutes: 20
    steps:
      - name: Checkout full history for merge-base diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.stage-a-result.outputs.merge_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: Enforce supported, patched Node.js
        run: node scripts/verify-node.mjs
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Compiler-backed quality checks
        run: npm run quality
      - name: Lint (Biome, warnings are errors)
        run: npm run lint
      - name: Formatting (repo docs/config/scripts)
        run: npm run format:check
      - name: Formatting (changed source and tests)
        run: npm run format:changed -- origin/main HEAD
      - name: Whitespace errors in diff
        run: git diff --check origin/main...HEAD
      - name: Workflow release-isolation and permission policy
        run: npm run verify:workflows
      - name: Lockfile and supply-chain integrity
        run: npm run verify:lockfile
      - name: Validate workflows with actionlint (checksum-verified)
        shell: bash
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tgz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  build-test:
    name: Build, tests, coverage and package integrity
    runs-on: ubuntu-latest
    needs: stage-a-result
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.stage-a-result.outputs.merge_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Clean production build
        run: npm run clean && npm run build
      - name: Unit, integration and regression tests
        run: npm test
      - name: Coverage thresholds
        run: npm run test:coverage
      - name: Package smoke test
        run: npm run verify:package

  dependency-audit:
    name: Dependency vulnerabilities and registry signatures
    runs-on: ubuntu-latest
    needs: stage-a-result
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.stage-a-result.outputs.merge_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm run audit:runtime
      - name: Production and development dependency audit
        run: npm run audit:all
      - name: Registry signatures and provenance attestations
        run: npm run audit:signatures

  secrets:
    name: Git history and PR secret scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: stage-a-result
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.stage-a-result.outputs.merge_sha }}
      - name: Scan for hardcoded credentials
        # This workflow_run event is unsupported by the Gitleaks Action wrapper.
        # Use the checksum-pinned CLI on the exact approved Git commit range.
        shell: bash
        run: |
          set -euo pipefail
          # Checkout is bound to the Stage A-verified immutable merge SHA.
          # Derive its protected-base parent from Git rather than passing
          # workflow_run outputs into the shell.
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          base_sha="$(git rev-parse HEAD^1)"
          [[ "$base_sha" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$base_sha^{commit}"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --exit-code=1 --log-opts="$base_sha..HEAD" .
