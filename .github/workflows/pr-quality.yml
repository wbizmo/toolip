name: PR Quality and Security

on:
  workflow_run:
    workflows: [Stage A Trusted Pre-execution Gate]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  stage-a-result:
    name: Verify trusted Stage A result
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.verify.outputs.repository }}
      pull_request: ${{ steps.verify.outputs.pull_request }}
      base_sha: ${{ steps.verify.outputs.base_sha }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      merge_sha: ${{ steps.verify.outputs.merge_sha }}
      complexity_evidence: ${{ steps.verify.outputs.complexity_evidence }}
    steps:
      - name: Checkout trusted default-branch verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Download metadata from the completed Stage A run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-a-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/stage-a
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate approval identity and immutable commits
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-stage-a-artifact.mjs "${{ runner.temp }}/stage-a/stage-a-approval.json"

  complexity-evidence:
    name: Require algorithmic complexity evidence
    runs-on: ubuntu-latest
    needs: stage-a-result
    if: needs.stage-a-result.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Verify PR time/space analysis is documented
        shell: bash
        env:
          COMPLEXITY_EVIDENCE: ${{ needs.stage-a-result.outputs.complexity_evidence }}
        run: |
          set -euo pipefail
          if [[ "$COMPLEXITY_EVIDENCE" != "true" ]]; then
            echo "Missing required PR complexity disclosure from the trusted Stage A event record."
            exit 1
          fi
          echo "Complexity disclosure present; reviewer must validate correctness."

  static:
    name: Typecheck, lint, formatting, workflow and lockfile policy
    runs-on: ubuntu-latest
    needs: stage-a-result
    timeout-minutes: 20
    steps:
      - name: Checkout full history for merge-base diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.stage-a-result.outputs.merge_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: Enforce supported, patched Node.js
        run: node scripts/verify-node.mjs
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Compiler-backed quality checks
        run: npm run quality
      - name: Lint (Biome, warnings are errors)
        run: npm run lint
      - name: Formatting (repo docs/config/scripts)
        run: npm run format:check
      - name: Formatting (changed source and tests)
        env:
          BASE_SHA: ${{ needs.stage-a-result.outputs.base_sha }}
          HEAD_SHA: ${{ needs.stage-a-result.outputs.head_sha }}
        run: npm run format:changed
      - name: Whitespace errors in diff
        env:
          BASE_SHA: ${{ needs.stage-a-result.outputs.base_sha }}
          HEAD_SHA: ${{ needs.stage-a-result.outputs.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Workflow release-isolation and permission policy
        run: npm run verify:workflows
      - name: Lockfile and supply-chain integrity
        run: npm run verify:lockfile
      - name: Validate workflows with actionlint (checksum-verified)
        shell: bash
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tgz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  build-test:
    name: Build, tests, coverage and package integrity
    runs-on: ubuntu-latest
    needs: stage-a-result
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.stage-a-result.outputs.merge_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Clean production build
        run: npm run clean && npm run build
      - name: Unit, integration and regression tests
        run: npm test
      - name: Coverage thresholds
        run: npm run test:coverage
      - name: Package smoke test
        run: npm run verify:package

  dependency-audit:
    name: Dependency vulnerabilities and registry signatures
    runs-on: ubuntu-latest
    needs: stage-a-result
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.stage-a-result.outputs.merge_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm run audit:runtime
      - name: Production and development dependency audit
        run: npm run audit:all
      - name: Registry signatures and provenance attestations
        run: npm run audit:signatures

  secrets:
    name: Git history and PR secret scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: stage-a-result
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.stage-a-result.outputs.merge_sha }}
      - name: Scan for hardcoded credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
