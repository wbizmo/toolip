name: PR Quality and Security

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck-build-test:
    name: Typecheck, build, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Compiler-backed quality checks
        run: npm run quality
      - name: Build
        run: npm run build
      - name: Behavioral tests
        run: npm test
      - name: Production dependency security audit
        run: npm run audit:runtime

  lint-format:
    name: Changed-file lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check whitespace, lint and format on changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          mapfile -d '' -t changed < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")
          code_files=()
          yaml_files=()
          for file in "${changed[@]}"; do
            test -f "$file" || continue
            case "$file" in
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.json|*.jsonc)
                code_files+=("$file") ;;
              *.yml|*.yaml)
                yaml_files+=("$file") ;;
            esac
          done
          if (("${#code_files[@]}" > 0)); then
            npm exec --yes --package=@biomejs/biome@2.2.7 -- biome check -- "${code_files[@]}"
          fi
          if (("${#yaml_files[@]}" > 0)); then
            npm exec --yes --package=prettier@3.6.2 -- prettier --check -- "${yaml_files[@]}"
          fi
          echo "Checked ${#code_files[@]} source/JSON files and ${#yaml_files[@]} YAML files."

  secrets:
    name: Git history and PR secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for hardcoded credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  codeql:
    name: CodeQL JavaScript/TypeScript security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
