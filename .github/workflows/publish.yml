name: Publish npm package

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - CHANGELOG.md
      - 'RELEASE_NOTES_v*.md'
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish, without a leading v
        required: true
        type: string
      confirmation:
        description: Type "publish toolip" to authorize the release
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify manual authorization
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "publish toolip" ]; then
            echo "Release authorization text did not match."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use current npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          actual="$(node -p "require('./package.json').version")"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$actual" != "${{ inputs.version }}" ]; then
            echo "Requested version ${{ inputs.version }} does not match package.json version $actual."
            exit 1
          fi

          echo "version=$actual" >> "$GITHUB_OUTPUT"

      - name: Check npm version availability
        id: availability
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "toolip@$VERSION" version --silent >/dev/null 2>&1; then
            echo "toolip@$VERSION is already published; nothing to do."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "toolip@$VERSION is not published yet."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact dependencies
        if: steps.availability.outputs.should_publish == 'true'
        run: npm ci

      - name: Verify packed release candidate
        if: steps.availability.outputs.should_publish == 'true'
        run: npm run release:check

      - name: Publish to npm
        if: steps.availability.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not available to the npm-release environment."
            exit 1
          fi
          npm publish --access public
