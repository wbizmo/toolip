name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish, without a leading v
        required: true
        type: string
      confirmation:
        description: Type "publish toolip" to authorize the release
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify manual authorization
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            if (process.env.PUBLISH_CONFIRMATION !== 'publish toolip') {
              core.setFailed('Release authorization text did not match.');
            }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use current npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Verify requested package version
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (process.env.REQUESTED_VERSION !== version) {
              core.setFailed(`Requested version does not match package.json version ${version}.`);
            }

      - name: Require matching verified GitHub release tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = `v${version}`;
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`
            });
            let target = ref.object.sha;
            if (ref.object.type === 'tag') {
              const { data: annotated } = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: target
              });
              target = annotated.object.sha;
            }
            if (target !== context.sha) {
              core.setFailed('The release tag must reference this exact main commit.');
              return;
            }
            await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });

      - name: Check npm version availability
        id: availability
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "toolip@$VERSION" version --silent >/dev/null 2>&1; then
            echo "toolip@$VERSION is already published; nothing to do."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "toolip@$VERSION is not published yet."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact dependencies
        if: steps.availability.outputs.should_publish == 'true'
        run: npm ci --ignore-scripts

      - name: Verify packed release candidate
        if: steps.availability.outputs.should_publish == 'true'
        run: npm run release:check

      - name: Attest and verify the exact packed release candidate
        if: steps.availability.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SOURCE_REPOSITORY="https://github.com/${GITHUB_REPOSITORY}"
          SOURCE_COMMIT="$GITHUB_SHA"
          TARBALL="toolip-${VERSION}.tgz"
          BUNDLE="${RUNNER_TEMP}/toolip-${VERSION}.sigstore.bundle.json"
          SUMMARY="${RUNNER_TEMP}/toolip-${VERSION}.attestation-summary.json"
          test -f "$TARBALL"

          node dist/src/index.js npm-attestation create \
            --tarball "$TARBALL" \
            --output "$BUNDLE" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" > "$SUMMARY"

          SCANNER_DIGEST="$(node -p \
            "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).scannerArtifactSha256" \
            "$SUMMARY")"
          node dist/src/index.js npm-attestation verify \
            --tarball "$TARBALL" \
            --bundle "$BUNDLE" \
            --certificate-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/wbizmo/toolip/.github/workflows/publish.yml@refs/heads/main" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --scanner-artifact-sha256 "$SCANNER_DIGEST"

      - name: Preserve the verified Sigstore attestation bundle
        if: steps.availability.outputs.should_publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolip-sigstore-attestation
          path: |
            ${{ runner.temp }}/toolip-*.sigstore.bundle.json
            ${{ runner.temp }}/toolip-*.attestation-summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish to npm with trusted publishing (OIDC)
        if: steps.availability.outputs.should_publish == 'true'
        # No NPM_TOKEN: npm >= 11.5.1 exchanges the job's OIDC identity for a
        # short-lived publish credential and attaches provenance. The
        # npm-release environment (required reviewers) gates this job.
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm publish --ignore-scripts "toolip-${VERSION}.tgz" --access public
