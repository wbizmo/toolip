name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish, without a leading v
        required: true
        type: string
      confirmation:
        description: Type "publish toolip" to authorize the release
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify manual authorization
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "publish toolip" ]; then
            echo "Release authorization text did not match."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use current npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Resolve release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(node -p "require('./package.json').version")"

          if [ "$actual" != "$REQUESTED_VERSION" ]; then
            echo "Requested version does not match package.json version $actual."
            exit 1
          fi

          echo "version=$actual" >> "$GITHUB_OUTPUT"

      - name: Require matching verified GitHub release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git fetch --tags --force
          test "$(git rev-list -n 1 "refs/tags/$TAG")" = "$GITHUB_SHA" || {
            echo "The release tag must reference this exact main commit." >&2
            exit 1
          }
          gh release view "$TAG" >/dev/null || {
            echo "A verified GitHub release must exist before npm publishing." >&2
            exit 1
          }

      - name: Check npm version availability
        id: availability
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "toolip@$VERSION" version --silent >/dev/null 2>&1; then
            echo "toolip@$VERSION is already published; nothing to do."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "toolip@$VERSION is not published yet."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact dependencies
        if: steps.availability.outputs.should_publish == 'true'
        run: npm ci --ignore-scripts

      - name: Verify packed release candidate
        if: steps.availability.outputs.should_publish == 'true'
        run: npm run release:check

      - name: Attest and verify the exact packed release candidate
        if: steps.availability.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="toolip-${VERSION}.tgz"
          BUNDLE="${RUNNER_TEMP}/toolip-${VERSION}.sigstore.bundle.json"
          SUMMARY="${RUNNER_TEMP}/toolip-${VERSION}.attestation-summary.json"
          test -f "$TARBALL"

          node dist/src/index.js npm-attestation create \
            --tarball "$TARBALL" \
            --output "$BUNDLE" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" > "$SUMMARY"

          SCANNER_DIGEST="$(node -p \
            "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).scannerArtifactSha256" \
            "$SUMMARY")"
          node dist/src/index.js npm-attestation verify \
            --tarball "$TARBALL" \
            --bundle "$BUNDLE" \
            --certificate-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/wbizmo/toolip/.github/workflows/publish.yml@refs/heads/main" \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --scanner-artifact-sha256 "$SCANNER_DIGEST"

      - name: Preserve the verified Sigstore attestation bundle
        if: steps.availability.outputs.should_publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolip-${{ steps.release.outputs.version }}-sigstore-attestation
          path: |
            ${{ runner.temp }}/toolip-${{ steps.release.outputs.version }}.sigstore.bundle.json
            ${{ runner.temp }}/toolip-${{ steps.release.outputs.version }}.attestation-summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish to npm with trusted publishing (OIDC)
        if: steps.availability.outputs.should_publish == 'true'
        # No NPM_TOKEN: npm >= 11.5.1 exchanges the job's OIDC identity for a
        # short-lived publish credential and attaches provenance. The
        # npm-release environment (required reviewers) gates this job.
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          VERSION: ${{ steps.release.outputs.version }}
        run: npm publish --ignore-scripts "toolip-${VERSION}.tgz" --access public
