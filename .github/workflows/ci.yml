name: CI

# Cross-platform build/test matrix. Static analysis and security gates live in
# pr-quality.yml so they run once, not once per matrix cell.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Stage A Trusted Pre-execution Gate]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.workflow_run.id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage-a-result:
    name: Verify trusted Stage A result
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.verify.outputs.repository }}
      pull_request: ${{ steps.verify.outputs.pull_request }}
      base_sha: ${{ steps.verify.outputs.base_sha }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      merge_sha: ${{ steps.verify.outputs.merge_sha }}
    steps:
      - name: Fail closed when Stage A did not succeed
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo 'Stage A did not succeed; downstream checks are blocked.'
          exit 1
      - name: Checkout trusted default-branch verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Download metadata from the completed Stage A run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-a-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/stage-a
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate approval identity and immutable commits
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-stage-a-artifact.mjs "${{ runner.temp }}/stage-a/stage-a-approval.json"

  platform:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: stage-a-result
    if: always() && (github.event_name == 'push' || needs.stage-a-result.result == 'success')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Floating majors resolve to the newest patched release; the
        # verify-node step enforces the minimum patched version in engines.
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && needs.stage-a-result.outputs.merge_sha || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Enforce supported, patched Node.js
        run: node scripts/verify-node.mjs
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck, quality, tests, coverage, build and package smoke test
        run: npm run verify:platform

  packed-artifact:
    name: Packed npm artifact (isolated install)
    runs-on: ubuntu-latest
    needs: stage-a-result
    if: always() && (github.event_name == 'push' || needs.stage-a-result.result == 'success')
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && needs.stage-a-result.outputs.merge_sha || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - name: Build, pack and verify tarball in an isolated prefix
        # Runs npm ci, full verify, npm pack --ignore-scripts and installs the
        # tarball into a throwaway prefix to execute the CLI. Never publishes.
        run: npm run release:check
