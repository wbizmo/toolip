name: CodeQL

# One workflow and job for approved PR merge objects, main and the weekly
# re-scan. Code scanning identifies a configuration by workflow path and job,
# so PR results can be compared against main's baseline when both come from
# this same job. PR analysis waits for Stage A and uses build-mode none so the
# exact merge tree is analyzed without executing its scripts.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Stage A Trusted Pre-execution Gate]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  stage-a-result:
    name: Verify trusted Stage A result
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pull_request: ${{ steps.verify.outputs.pull_request }}
      merge_sha: ${{ steps.verify.outputs.merge_sha }}
    steps:
      - name: Fail closed when Stage A did not succeed
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo 'Stage A did not succeed; CodeQL is blocked.'
          exit 1
      - name: Checkout trusted default-branch verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Download metadata from the completed Stage A run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage-a-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/stage-a
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Snapshot current PR identity outside the shell
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STAGE_A_APPROVAL_PATH: ${{ runner.temp }}/stage-a/stage-a-approval.json
          STAGE_A_CURRENT_PR_PATH: ${{ runner.temp }}/stage-a/current-pr.json
        with:
          script: |
            const fs = require('node:fs');
            const approvalText = fs.readFileSync(process.env.STAGE_A_APPROVAL_PATH, 'utf8');
            if (Buffer.byteLength(approvalText, 'utf8') > 256 * 1024) {
              core.setFailed('Stage A approval artifact exceeds its size budget.');
              return;
            }
            const approval = JSON.parse(approvalText);
            if (!Number.isSafeInteger(approval.pullRequest)) {
              core.setFailed('Stage A approval has an invalid pull request number.');
              return;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: approval.pullRequest
            });
            const identity = {
              number: pullRequest.number,
              state: pullRequest.state,
              body: pullRequest.body,
              base: {
                repo: { full_name: pullRequest.base.repo.full_name },
                ref: pullRequest.base.ref,
                sha: pullRequest.base.sha
              },
              head: { sha: pullRequest.head.sha },
              merge_commit_sha: pullRequest.merge_commit_sha
            };
            fs.writeFileSync(process.env.STAGE_A_CURRENT_PR_PATH, JSON.stringify(identity), { mode: 0o600 });
      - name: Validate approval identity and immutable commits
        id: verify
        env:
          TOOLIP_STAGE_A_NPM_PROVENANCE_POLICY: ${{ vars.TOOLIP_STAGE_A_NPM_PROVENANCE_POLICY }}
          TOOLIP_STAGE_A_CARGO_SHA256_POLICY: ${{ vars.TOOLIP_STAGE_A_CARGO_SHA256_POLICY }}
        run: node scripts/verify-stage-a-artifact.mjs "${{ runner.temp }}/stage-a/stage-a-approval.json" "${{ runner.temp }}/stage-a/current-pr.json"

  analyze:
    name: CodeQL JavaScript/TypeScript security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: stage-a-result
    if: always() && (needs.stage-a-result.result == 'success' || github.event_name != 'workflow_run')
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && needs.stage-a-result.outputs.merge_sha || github.ref }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          ref: ${{ github.event_name == 'workflow_run' && format('refs/pull/{0}/merge', needs.stage-a-result.outputs.pull_request) || github.ref }}
          sha: ${{ github.event_name == 'workflow_run' && needs.stage-a-result.outputs.merge_sha || github.sha }}
