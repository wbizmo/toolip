name: CodeQL

# One workflow and job for PRs, main and the weekly re-scan. Code scanning
# identifies a configuration by workflow path and job, so PR results can only be
# compared against main's baseline when both come from this same job. (When PR
# analysis ran from pr-quality.yml, GitHub reported "1 configuration not found"
# and could not attribute new alerts to the PR.)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL JavaScript/TypeScript security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
