name: Temporary OpenChain source formatting
on:
  push:
    branches:
      - docs/openchain-5230-18974-program-20261118
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Apply the repository's exact Prettier rules
        run: npx --no-install prettier --write docs/openchain/OPENSSF-GOLD-CHECKLIST.md
      - name: Commit only formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/openchain/OPENSSF-GOLD-CHECKLIST.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format OpenChain and OpenSSF files"
            git push origin "HEAD:docs/openchain-5230-18974-program-20261118"
          fi
