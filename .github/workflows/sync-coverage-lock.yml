name: Sync coverage lockfile

on:
  push:
    branches:
      - fix/issue-11-quality-release

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-11-quality-release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Synchronize package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync coverage provider lockfile"
          git push origin HEAD:fix/issue-11-quality-release
