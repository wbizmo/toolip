name: Create GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to release, without a leading v
        required: true
        type: string
      confirmation:
        description: Type "release toolip" to authorize this GitHub release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Require explicit release authorization
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            if (process.env.RELEASE_CONFIRMATION !== 'release toolip') {
              core.setFailed('Exact release authorization text required.');
            }

      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Verify requested release metadata
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = process.env.REQUESTED_VERSION;
            const notesPath = `RELEASE_NOTES_v${pkg.version}.md`;
            if (version !== pkg.version) {
              core.setFailed('Requested version does not match package.json.');
              return;
            }
            if (!fs.existsSync(notesPath)) {
              core.setFailed(`Missing ${notesPath}`);
              return;
            }
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            if (!changelog.includes(`## ${version} -`)) {
              core.setFailed(`CHANGELOG.md does not contain ## ${version} -`);
              return;
            }
            if (!/^# .+$/u.test(fs.readFileSync(notesPath, 'utf8').split(/\r?\n/u, 1)[0] ?? '')) {
              core.setFailed('Release notes must begin with a Markdown H1 title.');
            }

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Verify release candidate
        run: npm run release:check

      - name: Create tag and GitHub release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.info(`GitHub release ${tag} already exists; skipping creation.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              core.setFailed(`Tag ${tag} exists without a matching GitHub release; refusing to overwrite it.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const notesPath = `RELEASE_NOTES_v${version}.md`;
            const notes = fs.readFileSync(notesPath, 'utf8');
            const title = notes.split(/\r?\n/u, 1)[0]?.replace(/^# /u, '').trim();
            if (!title) throw new Error('Release notes must begin with a Markdown H1 title.');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: title,
              body: notes
            });
            core.info(`Created ${tag} from verified commit ${context.sha}.`);
